name: EmployeeAttritionModel
data: 
  as_frame: True
  path: ../data/raw_dataset.csv
  version: "1.0"

Model_type: "RandomForestClassifier"
test_size: 0.2
random_state: 42
n_estimators: 100      # Number of trees (more = better, but slower)
max_depth: 10          # Individual tree depth
min_samples_split: 10   # Tree splitting criteria
# max_features='sqrt',   # Features per tree (default for classification)
bootstrap: True        # Sample with replacement
class_weight: balanced

model: 
  type: random_forest
  n_estimators: 500
  max_depth: 20
  min_samples_split: 5

experiments:
  - name: Trial_1
    test_size: 0.25
    random_state: 42
    model:
      n_estimators: 200
      max_depth: 20
      min_samples_split: 5
  - name: Trial_2
    test_size: 0.25
    random_state: 42
    model:
      n_estimators: 500
      max_depth: 1
      min_samples_split: 8
  - name: Trial_3
    test_size: 0.25
    random_state: 42
    model:
      n_estimators: 200
      max_depth: 10
      min_samples_split: 5
  - name: Trial_4
    test_size: 0.25
    random_state: 42
    model:
      n_estimators: 100
      max_depth: 10
      min_samples_split: 20
  - name: Trial_5
    test_size: 0.25
    random_state: 42
    model:
      n_estimators: 300
      max_depth: 50
      min_samples_split: 20